version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD

# FILE, the default, treats moving a type between files as breaking, because
# generated code in most languages is laid out per file. That is the right
# rule once anything imports this: an SDK we do not build is still on the
# other end of it.
#
# Declared but not yet gated in `cargo xtask lint`, unlike lint and format.
# The packages are `v1alpha1`, which is the ecosystem's word for a contract
# that may break without notice, and the server is `0.y.z`, which is semver's.
# Both say the same thing, so gating on breakage now would enforce a promise
# neither one makes. Add `buf breaking` against the current channel branch to
# the gate when the packages become `v1`, which is when the server reaches
# 1.0.0.
breaking:
  use:
    - FILE
