[package]
name = "enroute-postgres"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "enroute_postgres"
path = "src/lib.rs"

[[bin]]
name = "enroute-schema"
path = "src/bin/enroute-schema.rs"

[lints]
workspace = true

[features]
# Everything here needs a database, so every test target below is gated. A
# build that only wants the implementations takes none of them.
postgres-tests = []

[[test]]
name = "catalog"
required-features = ["postgres-tests"]

[[test]]
name = "conformance"
required-features = ["postgres-tests"]

[[test]]
name = "identity"
required-features = ["postgres-tests"]

[[test]]
name = "ingest"
required-features = ["postgres-tests"]

[[test]]
name = "ledger"
required-features = ["postgres-tests"]

[[test]]
name = "migrate"
required-features = ["postgres-tests"]

[[test]]
name = "storage"
required-features = ["postgres-tests"]

[dependencies]
enroute-config = { workspace = true, features = ["file"] }
enroute-git-core.workspace = true
enroute-git-journal.workspace = true
enroute-git-metadata.workspace = true
enroute-git-retrieve.workspace = true
enroute-git-store.workspace = true
enroute-lattice-core.workspace = true
enroute-lattice-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
gix-hash.workspace = true
gix-object.workspace = true
object_store.workspace = true
sqlx.workspace = true
sqlx-pg-copy.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
enroute-git-core = { workspace = true, features = ["fixtures"] }
enroute-git-cost.workspace = true
enroute-git-graph.workspace = true
futures.workspace = true
roaring.workspace = true
enroute-git-metadata = { workspace = true, features = ["conformance"] }
enroute-git-ingest.workspace = true
enroute-git-test-support.workspace = true
enroute-lattice-store = { workspace = true, features = ["conformance"] }
