[package]
name = "enroute-ingest-lambda"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "enroute_ingest_lambda"
path = "src/lib.rs"

[[bin]]
name = "enroute-ingest-lambda"
path = "src/main.rs"
required-features = ["server"]

[features]
# Both ends by default, so `cargo check`/`cargo test` cover both — a feature no
# default build touches is a feature whose tests never run. Neither shipped
# build uses this: the front door asks for `client` with defaults off, and the
# worker's own build asks for `server` the same way.
#
# Note what that does and doesn't guarantee. Cargo unifies a package's features
# across one build graph, so a `--workspace` build compiles this lib with both
# and the front door links the union. What keeps the *artifact* clean is that
# the Dockerfile builds `--bin enroute`, whose graph reaches only `client`.
# Separate crates, not features, would make the isolation structural.
default = ["client", "server"]
# The front door's end: staging a pack and invoking the function.
client = ["dep:aws-sdk-lambda"]
# The worker's end: everything needed to actually ingest, including the Lambda
# runtime the front door must not link.
server = [
    "dep:http",
    "dep:lambda_runtime",
    "dep:opentelemetry-otlp",
    "dep:sqlx",
    "dep:tokio-util",
    "dep:tracing-subscriber",
]

[lints]
workspace = true

[dependencies]
enroute-postgres.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
gix-hash.workspace = true
# The workspace has its defaults off: this crate names the store grammar,
# `Bucket` and `Secret`, and none of the file schema — so neither end links a
# TOML parser or the tables the front door reads.
enroute-config.workspace = true
enroute-git-core.workspace = true
enroute-git-cost.workspace = true
enroute-git-ingest.workspace = true
enroute-git-retrieve.workspace = true
enroute-git-store.workspace = true
object_store.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true

aws-sdk-lambda = { workspace = true, optional = true }
http = { workspace = true, optional = true }
lambda_runtime = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
enroute-git-test-support.workspace = true
