syntax = "proto3";

package enroute.common.v1alpha1;

// The names both directions of the contract spell. Deliberately small: a type
// earns a place here by being named by what an application calls *and* by
// what calls an application back, and nothing else is.

// A repository, by the name its application gave it.
//
// You choose this at CreateRepository and every later call spells it, so there
// is no id of ours to store beside your own. Unique within your tenant, and
// opaque to Enroute, which never reads anything out of one.
message RepoKey {
  // ASCII letters, digits, `-`, `_` and `.`, at most 256 bytes, starting and
  // ending with a letter or digit. Compared byte for byte, so `Repo` and
  // `repo` are two repositories.
  //
  // Use an id you allocated and will not change — a UUID, a ULID, a row id. A
  // key is what a repository *is* here, so a name a rename moves, `owner/repo`
  // above all, would come to name a different one.
  string key = 1;
}

// A git object id.
//
// A message rather than a bare string, so a generated client cannot pass a
// refname where an object id belongs, and so absence has one spelling across
// the whole contract. Where an id is optional — the old side of a create, the
// new side of a delete — the field is unset, rather than the all-zero oid git
// writes on the wire or an empty string.
message ObjectId {
  // Lowercase hex, 40 characters. Every repository is SHA-1: nothing here
  // negotiates a hash algorithm, and this widens when something does.
  //
  // Hex rather than raw bytes because a caller holds an id as hex already,
  // having read it from a listing — raw bytes would buy a smaller message at
  // the price of a decode in every generated client.
  string hex = 1;
}
