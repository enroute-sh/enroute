# What an Enroute deployment is, read once at startup:
#
#     enroute --config file:///etc/enroute/enroute.toml
#     enroute --config s3://my-config/enroute.toml
#
# Any string may hold `${VAR}` from the environment. `$$` is a literal `$`, a
# bare `$NAME` is refused, and a name the environment does not hold stops the
# load. Numbers and booleans do not interpolate. Unknown keys are refused.
#
# Credentials are named here, not held: keep them `${VAR}` and this file stays
# something to commit. See docs/operate/configuration.md for the rest.

# Any store object_store reaches — s3://, gs://, az://, https://, file://,
# memory:// — with the backend's own settings as the query, so `?endpoint=...`
# belongs to the bucket that needs it. Nodes that share a bucket find each
# other through it. A `file://` bucket takes no query.
[bucket]
uri = "s3://enroute-objects/prefix"

# Only if the deployment has no role for the SDK to find. Prefer one that it
# does — an instance role, IRSA — and leave this out. A credential never goes
# in the query: a query value is form-decoded, so a `+` in a base64 key would
# silently become a space, and one there is refused where it is written.
#
#     [bucket.credentials]
#     access_key_id = "${AWS_ACCESS_KEY_ID}"
#     secret_access_key = "${AWS_SECRET_ACCESS_KEY}"

# The node this process runs.
[node]
# Its replicated log and state. Keep it on a durable disk: a node that loses
# this directory comes back as a new node. The image declares it a volume.
data_dir = "/var/lib/enroute/node"
# "both" runs the ledger and serves git and the contract. "ledger" runs only
# the ledger, and needs `advertise_url`. "compute" serves only git and the
# contract, and finds the ledger's members in the bucket.
role = "both"
# Every node serves `GET /status` on `internal_listen`. Keep that port inside
# the cluster. Set `advertise_url` to replicate the ledger across nodes: other
# nodes dial it, and it reaches `internal_listen`. Leave it out for one node.
# internal_listen = "0.0.0.0:7400"
# advertise_url = "http://enroute-0.internal:7400"
# On a ledger node, the failure domain it runs in, such as an availability
# zone. Each repository's log keeps its replicas in distinct zones where the
# members allow it. Leave it out for no zone.
# zone = "eu-central-1a"
#
# The rest of this table, and all of `[layers]` and `[ledger]`, tune the
# engine. Each key shows its default unless its comment says otherwise. Leave
# a key out to take the engine's own.
#
# Workers for CPU-bound work. 0 is one for each core.
# cpu_threads = 0
# Sizes take a unit: "512 MiB", "2 GiB". A bare number is bytes.
#
# Decoded objects and entries.
# cache = "512 MiB"
# The buffer pool that layer files are read through.
# page_cache = "256 MiB"
# Local copies of layers read from `bucket`. 0 sets no limit.
# disk_cache = 0
# Files that layer storage keeps open. Leave it out to use the system's open-file
# limit less a reserve (the larger of 256 and a quarter of the limit). A higher
# value is lowered to that ceiling. 768 is an example, not a default.
# max_open_files = 768
# Durations take a unit: "300ms", "15m", "6h".
#
# Drop a repository's view once it is unused this long.
# evict_after = "15m"

# Concurrent requests to `bucket`, shared by kinds of work. A kind can always
# use its `reserve`, never more than its `limit`, and shares the rest by
# `weight`. The commit reserve keeps pushes on time under load, and the
# background limit keeps compaction and hydration from crowding out pushes.
# [store_io]
# slots = 256
# commit = { reserve = 16, limit = 128, weight = 4 }
# foreground = { reserve = 8, limit = 128, weight = 2 }
# background = { reserve = 4, limit = 128, weight = 1 }

# How a compute writes, merges and deletes layers. A small push travels in the
# log as an inline layer, and is flushed to `bucket` later.
# [layers]
# Merge this many stored layers of about one size at a time. 0 is never.
# merge_factor = 8
# The largest layer that travels in the log. 0 uploads every push.
# inline_layer = "1 MiB"
# Inline layers a repository holds before a push uploads first.
# max_inline = "64 MiB"
# Flush inline layers once the oldest is this old...
# flush_interval = "30s"
# ...or once there are this many.
# flush_max_layers = 256
# How often the sweep runs on each repository, and how long it keeps a layer
# file that nothing names.
# sweep_interval = "1h"
# sweep_retention = "6h"

# On a node that runs the ledger.
# [ledger]
# The state store's block cache and memtables.
# state_memory = "512 MiB"
# The largest inline layer to accept. A push that carries a larger layer is
# refused. 0 refuses every push that carries its layer, so no repository content
# passes through the ledger. Keep every compute's inline_layer at most this.
# max_inline_layer = "1 MiB"
# Create SHA-256 repositories (git's sha256 object format). Turn it on once
# every node runs a release that reads them: an older one cannot.
# allow_sha256 = false

[hooks]
# The hooks to call. Every hook is opt-in: leave the table out and git reads
# and writes with no check. A hook not listed takes the default that
# docs/reference/hooks.md gives. The other keys are required when a hook is
# listed.
enabled = ["authorize", "visible_refs", "pre_receive", "post_receive"]
# Where your application answers. Every hook call is a POST to this one URL.
# Keep the path in whatever namespace your framework reserves for machine
# traffic: a compute serves repositories at paths named after repositories, so a
# hook at `/enroute/hooks` is a hook a repository named `enroute` takes away.
endpoint_url = "https://app.example.com/api/enroute/hooks"
# Enroute holds this half, an application holds the public one.
signing_key = "${ENROUTE_HOOK_SIGNING_KEY}"
# How long your application has to answer before the git request fails. Your
# budget, not Enroute's: raise it for a heavy cold start, lower it to fail fast.
timeout = "10s"
# What pre_receive sees: "commands" (one log entry per push), or "objects",
# which also lets it read the pushed objects through the API before it
# answers (two log entries per push). Used only if pre_receive is enabled.
pre_receive_mode = "commands"

# Both default to every interface, which is what a container needs.
[listen]
api = "0.0.0.0:50051"
git = "0.0.0.0:8080"

[git]
# A push to a missing repository creates it: under the URL path without
# authorize, and under the granted key with it. Set false to create
# repositories only with CreateRepository.
create_on_push = true
# The object format of a repository whose creator names none: one a push
# creates, or CreateRepository without object_format. "sha1" or "sha256"
# (which needs ledger.allow_sha256).
default_object_format = "sha1"
# Let PushToRemote and FetchFromRemote dial http:// and addresses off the
# public internet, for a development stack or a git server inside your own
# network.
allow_private_remotes = false
# A push or API commit with a larger object fails. GitHub refuses at 100 MiB.
max_object_size = "100 MiB"

# Where spans go, over OTLP. Leave the table out and only the console gets
# them. The endpoint is dialed as written — no `/v1/traces` is appended — and
# the headers are how a collector knows the caller, so a vendor is a URL and
# two headers rather than anything this repository names.
#
#     [telemetry]
#     endpoint = "https://otlp.example.com/v1/traces"
#     sample_ratio = 1.0                  # head-based, 0.0 to 1.0
#
#     [telemetry.headers]
#     authorization = "Bearer ${OTEL_TOKEN}"
#     "x-dataset" = "enroute"
#
# A header value is a secret like any other, so keep the token a `${VAR}`.
